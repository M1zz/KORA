name: CI

# 로컬에서만 돌던 배포 게이트(scripts/predeploy.sh)와 단위 시험을 push · PR 마다 돌린다.
# 게이트 로직은 predeploy.sh 한 곳에만 둔다 - 여기서 명령을 복제하면 로컬과 CI 가 갈라진다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 게이트 · 빌드 · 단위 시험
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # LeeoKit 이 iOS 26 SDK 의 API(glassEffect 등)를 쓴다. 기기에 있는 가장 새 Xcode 를 고른다.
      - name: Xcode 고르기
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # LeeoKit(공개 SPM 패키지)을 매번 새로 받지 않도록 캐시.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # 버전 소스 · 카탈로그 빈칸 · 화면 문구 생성본 · Release 빌드.
      - name: 배포 게이트 (predeploy.sh)
        run: sh scripts/predeploy.sh

      - name: 단위 시험 (KORATests)
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)? \(' | sed 's/ ($//')
          echo "시뮬레이터: $DEST"
          xcodebuild test \
            -project KORA.xcodeproj \
            -scheme KORA \
            -only-testing:KORATests \
            -destination "platform=iOS Simulator,name=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint 설치
        run: brew install swiftlint
      - name: SwiftLint 실행
        run: swiftlint --strict
