# SwiftLint - 최소 규칙으로 시작한다 (클립키보드와 같은 방침).
#
# ⚠️ 의도적으로 몇 개만 켠다. 전체 규칙을 걸면 경고가 쏟아지고, 그러면 아무도 안 본다.
#    여기 있는 규칙은 "나오면 반드시 고친다"는 뜻이다.
#    규칙을 늘릴 땐 한 번에 하나씩, 기존 위반을 0으로 만든 뒤에 추가할 것.
#
# 실행: swiftlint            (경고 확인)
#       swiftlint --strict   (CI - 경고도 실패 처리)

only_rules:
  - force_try          # try! - 새로 들어오는 것을 막는다
  - force_unwrapping   # 옵셔널 강제 언랩. 크래시 1순위 원인
  - file_length        # 파일 비대화 방지

included:
  - KORA
  - widget
# KORATests · KORAUITests 는 제외 - 시험에서 강제 언랩은 "여기서 바로 실패하라"는 관용 표현이다.

excluded:
  - build
  - KORA/Sources/Features/Subway/SubwayNavigatorCatalog.swift   # 생성 파일 (gen_navloc.py)
  - KORA/Sources/Features/Subway/SubwayStationDataExpansion.swift
  - KORA/Sources/Features/Subway/SubwayStationChineseTraditionalNames.swift

file_length:
  # SubwayNavigatorView(주석 빼고 2900줄대)를 화면 단위로 쪼개는 게 목표. 지금은 더 커지지 않게만 막는다.
  # CI 는 --strict 라 경고도 실패다. 그래서 경고 선을 지금 크기 바로 위에 둔다. 쪼개면 1000 으로 되돌린다.
  warning: 3000
  error: 4000
  ignore_comment_only_lines: true

reporter: "xcode"
