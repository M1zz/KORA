<link rel="icon" href="icon.png">
<script>
(function () {
  // Pick a language from the browser preferences and jump to that page.
  function pick(tag) {
    var t = String(tag || '').toLowerCase();
    if (t.indexOf('zh') === 0) {
      return /hant|-tw|-hk|-mo/.test(t) ? 'zh-Hant' : 'zh-Hans';
    }
    if (t.indexOf('ko') === 0) return 'ko';
    if (t.indexOf('ja') === 0) return 'ja';
    if (t.indexOf('en') === 0) return 'en';
    return null;
  }
  var prefs = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || 'en'];
  var lang = null;
  for (var i = 0; i < prefs.length && !lang; i++) lang = pick(prefs[i]);
  location.replace((lang || 'en') + '/' + location.hash);
})();
</script>
</head>

<div class="container">
  <header class="site">
    <img src="icon.png" alt="KORA">

    <li><a href="zh-Hant/" hreflang="zh-Hant" lang="zh-Hant">繁體中文 — 首頁</a></li>
  </ul>
</div>
